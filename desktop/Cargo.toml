[package]
name = "manor-desktop"
version = "0.1.0"
description = "Manor desktop shell"
edition = "2021"
# Raised from 1.77.2 by `hashlink`, which rusqlite's statement cache needs.
rust-version = "1.85"
publish = false

[lib]
name = "manor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-log = "2.9.1"
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2.3.1"
tauri-plugin-window-state = "2.4.1"
log = { version = "0.4", features = ["kv"] }
serde = { version = "1", features = ["derive"] }
# Named by the code that `tauri::generate_context!` expands to.
serde_json = "1"
# Carries its own SQLite, so the mirror does not depend on the system library.
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Neither plugin builds for mobile, and the Manor shell targets desktop only.
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
tauri-plugin-updater = "2.11.0"
