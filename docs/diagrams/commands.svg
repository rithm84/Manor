ions</text><text x="159" y="70.400390625" font-family="Helvetica, Segoe UI Emoji" font-size="20px" fill="#343a40" text-anchor="middle" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Increment affected versions</text></g><g stroke-linecap="round"><g transform="translate(720 575) rotate(0 0 77.5)"><path d="M0 0 C0 31.01, 0 62.02, 0 155 M0 0 C0 40.91, 0 81.82, 0 155" stroke="#343a40" stroke-width="2" fill="none"></path></g><g transform="translate(720 575) rotate(0 0 77.5)"><path d="M-8.55 131.51 C-6.84 136.21, -5.13 140.91, 0 155 M-8.55 131.51 C-6.29 137.71, -4.04 143.91, 0 155" stroke="#343a40" stroke-width="2" fill="none"></path></g><g transform="translate(720 575) rotate(0 0 77.5)"><path d="M8.55 131.51 C6.84 136.21, 5.13 140.91, 0 155 M8.55 131.51 C6.29 137.71, 4.04 143.91, 0 155" stroke="#343a40" stroke-width="2" fill="none"></path></g></g><mask></mask><g transform="translate(740 640) rotate(0 51.42500000000001 11.050000000000011)"><text x="0" y="15.64033203125" font-family="Helvetica, Segoe UI Emoji" font-size="17px" fill="#343a40" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">new command</text></g><g stroke-linecap="round" transform="translate(545 1030) rotate(0 175 65)"><path d="M32 0 C112.02 0, 192.04 0, 318 0 C339.33 0, 350 10.67, 350 32 C350 55.43, 350 78.86, 350 98 C350 119.33, 339.33 130, 318 130 C233.37 130, 148.74 130, 32 130 C10.67 130, 0 119.33, 0 98 C0 84.45, 0 70.89, 0 32 C0 10.67, 10.67 0, 32 0" stroke="none" stroke-width="0" fill="#d3f9d8"></path><path d="M32 0 C89.22 0, 146.44 0, 318 0 M32 0 C91.46 0, 150.93 0, 318 0 M318 0 C339.33 0, 350 10.67, 350 32 M318 0 C339.33 0, 350 10.67, 350 32 M350 32 C350 48.17, 350 64.34, 350 98 M350 32 C350 48.72, 350 65.44, 350 98 M350 98 C350 119.33, 339.33 130, 318 130 M350 98 C350 119.33, 339.33 130, 318 130 M318 130 C255.25 130, 192.49 130, 32 130 M318 130 C254.66 130, 191.31 130, 32 130 M32 130 C10.67 130, 0 119.33, 0 98 M32 130 C10.67 130