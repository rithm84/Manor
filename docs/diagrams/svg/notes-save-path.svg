nchor="middle">yes</text></g><g class="pele-edge-label" data-id="async_1"><rect x="762.06" y="499.5" width="72.58" height="21" rx="3" fill="var(--_bg)"/><text x="798.35" y="514.9" text-anchor="middle">no answer</text></g><g class="pele-edge-label" data-id="async_2"><rect x="790.06" y="423" width="109.16" height="21" rx="3" fill="var(--_bg)"/><text x="844.64" y="438.4" text-anchor="middle">connection back</text></g></g><g class="pele-nodes"><g class="pele-node pele-shape-stadium people" data-id="edit" transform="translate(734.37,57)"><rect x="-186.13" y="-33" width="372.26" height="66" rx="33" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">Edit in the note</tspan><tspan x="0" y="16.1">Block model updated once per run-loop turn</tspan></text></g><g class="pele-node pele-shape-cyl local" data-id="protect" transform="translate(734.37,183)"><path d="M-185.56,-33A185.56,12 0 0 1 185.56,-33V33A185.56,12 0 0 1 -185.56,33Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-185.56,-33A185.56,12 0 0 0 185.56,-33" fill="none" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="1.1" font-weight="var(--_w)">Protect the draft</tspan><tspan x="0" y="22.1">NotesDrafts.sqlite · base revision · mutation id</tspan></text></g><g class="pele-node pele-shape-hex gate" data-id="queue" transform="translate(734.37,309)"><polygon points="-150.71,-33 150.71,-33 167.21,0 150.71,33 -150.71,33 -167.21,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9" font-weight="var(--_w)">Per-note save queue</tspan><tspan x="0" y="16.1">650 ms debounce · one save in flight</tspan></text></g><g class="pele-node pele-shape-rect backend" data-id="send" transform="translate(624.1,433.5)"><rect x="-109.82" y="-43.5" width="219.63" height="87" fill="var(--_s)" stroke="var(--_b)" style="rx:v