sage" data-id="i14"><path d="M291.35,508H932.14"/><path class="pele-marker" d="M939.14,508L931.14,511.36L931.14,504.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="275.35" y="500" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="283.35" y="512.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">9</text></g></g><g class="pele-edge pele-message" data-id="i15"><path d="M272.68,545H7" stroke-dasharray="4 4"/><path class="pele-marker" d="M0,545L8,541.64L8,548.36Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="272.68" y="537" width="21.34" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="283.35" y="549.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">10</text></g></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="i1"><text x="145.68" y="77.4" text-anchor="middle">operation · input · expected_revision</text></g><g class="pele-edge-label" data-id="i2"><text x="427.45" y="114.4" text-anchor="middle">command_id · operation · input</text></g><g class="pele-edge-label" data-id="i3"><text x="720.7" y="153.9" text-anchor="middle">authorize · validate · check revision</text></g><g class="pele-edge-label" data-id="i5"><text x="756.34" y="224.9" text-anchor="middle">rows + action events + receipt · one transaction</text></g><g class="pele-edge-label" data-id="i6"><text x="419.45" y="258.4" text-anchor="middle">receipt · committed record · revision</text></g><g class="pele-edge-label" data-id="i8"><text x="419.45" y="328.4" text-anchor="middle">conflict with current state</text></g><g class="pele-edge-label" data-id="i11"><text x="427.45" y="412.4" text-anchor="middle">same command_id</text></g><g class="pele-edge-label" data-id="i12"><text x="419.45" y="449.4" text-anchor="middle">stored receipt · replayed</text></g><g class="pele-edge-label" data-id="i14"><rect x="541.05" y="485" width="148.39" height="17" rx="3" fill