<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1125 657" width="1125" height="657" style="max-width:100%;height:auto" role="img" aria-label="Command path · one write from a page or an agent, with a retry"><title>Command path · one write from a page or an agent, with a retry</title><style><![CDATA[
/*
  Shared Manor diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::app`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #25222a;
  --pele-muted: #625a6c;
  --pele-line: #5f5869;
  --pele-surface: #f4f3f6;
  --pele-surface-alt: #f8f7fa;
  --pele-border: #625a6c;
  --pele-accent: #75508f;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;   --people-stroke: #1971c2;
  --app-fill: #f3ecf8;      --app-stroke: #75508f;
  --local-fill: #e3fafc;    --local-stroke: #0c8599;
  --backend-fill: #e5f5e8;  --backend-stroke: #2f9e44;
  --agent-fill: #edf2ff;    --agent-stroke: #4263eb;
  --external-fill: #fff0ed; --external-stroke: #c44d41;
  --async-fill: #ffe8cc;    --async-stroke: #e8590c;
  --gate-fill: #fff4d6;     --gate-stroke: #b37c00;
  --neutral-fill: #f4f3f6;  --neutral-stroke: #625a6c;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #19181d;
    --pele-fg: #f3eff7;
    --pele-muted: #b9afc4;
    --pele-line: #b9afc4;
    --pele-surface: #201f25;
    --pele-surface-alt: #1c1b21;
    --pele-border: #887b94;
    --pele-accent: #c29bdc;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;   --people-stroke: #4dabf7;
    --app-fill: #2c2136;      --app-stroke: #c29bdc;
    --local-fill: #0b3338;    --local-stroke: #3bc9db;
    --backend-fill: #11321b;  --backend-stroke: #51cf66;
    --agent-fill: #1b2349;    --agent-stroke: #91a7ff;
    --external-fill: #3d1714; --external-stroke: #ff8787;
    --async-fill: #4a2508;    --async-stroke: #ff922b;
    --gate-fill: #3d2e05;     --gate-stroke: #fcc419;
    --neutral-fill: #26242c;  --neutral-stroke: #9d93a8;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.app > :is(rect, path, polygon, circle, ellipse),
.pele-node.app > g > path { fill: var(--app-fill); stroke: var(--app-stroke); }
.pele-node.local > :is(rect, path, polygon, circle, ellipse),
.pele-node.local > g > path { fill: var(--local-fill); stroke: var(--local-stroke); }
.pele-node.backend > :is(rect, path, polygon, circle, ellipse),
.pele-node.backend > g > path { fill: var(--backend-fill); stroke: var(--backend-stroke); }
.pele-node.agent > :is(rect, path, polygon, circle, ellipse),
.pele-node.agent > g > path { fill: var(--agent-fill); stroke: var(--agent-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1125" height="657" rx="8"/><svg x="0" y="0" class="pele pele-sequence" viewBox="0 0 1125 657" width="1125" height="657" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="sequence"><g transform="translate(103.14,24)"><g class="pele-lifelines" fill="none" stroke="var(--_b)"><path class="pele-lifeline" data-id="caller" d="M0,44V565"/><path class="pele-lifeline" data-id="gw" d="M283.35,44V565"/><path class="pele-lifeline" data-id="pg" d="M563.54,44V565"/><path class="pele-lifeline" data-id="mirror" d="M939.14,44V565"/></g><g class="pele-frames" font-size="14" stroke="var(--_b)"><g class="pele-frame pele-frame-alt"><rect x="263.35" y="172" width="679.79" height="178" fill="none" style="rx:var(--_r)"/><path d="M263.35,280H943.14" stroke-dasharray="4 4"/><rect x="268.35" y="284" width="107.92" height="17" rx="3" fill="var(--_bg)" stroke="none"/><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="322.31" y="297.4" text-anchor="middle">[revision moved]</text><rect x="263.35" y="172" width="28" height="20" fill="var(--_s)" style="rx:var(--_r)"/><text class="pele-frame-kind" x="277.35" y="186.2" text-anchor="middle" font-size="12" font-weight="var(--_hw)" fill="var(--_m)" stroke="none">alt</text><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="351.09" y="187.4" text-anchor="middle">[revision current]</text></g><g class="pele-frame pele-frame-opt"><rect x="263.35" y="362" width="320.19" height="109" fill="none" style="rx:var(--_r)"/><rect x="263.35" y="362" width="32.66" height="20" fill="var(--_s)" style="rx:var(--_r)"/><text class="pele-frame-kind" x="279.68" y="376.2" text-anchor="middle" font-size="12" font-weight="var(--_hw)" fill="var(--_m)" stroke="none">opt</text><text class="pele-frame-label" fill="var(--_m)" stroke="none" x="416.05" y="377.4" text-anchor="middle">[no answer, or a serialization failure]</text></g></g><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-message" data-id="i1"><path d="M8,87H276.35"/><path class="pele-marker" d="M283.35,87L275.35,90.36L275.35,83.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="-8" y="79" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="0" y="91.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">1</text></g></g><g class="pele-edge pele-message" data-id="i2"><path d="M291.35,124H556.54"/><path class="pele-marker" d="M563.54,124L555.54,127.36L555.54,120.64Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="275.35" y="116" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="283.35" y="128.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">2</text></g></g><g class="pele-edge pele-message" data-id="i3"><path d="M571.54,138H593.54A6,6 0 0 1 599.54,144V154A6,6 0 0 1 593.54,160H570.54"/><path class="pele-marker" d="M563.54,160L571.54,156.64L571.54,163.36Z" fill="var(--_l)" stroke="none"/><g class="pele-sequence-number"><rect x="555.54" y="130" width="16" height="16" rx="8" fill="var(--_l)" stroke="none"/><text x="563.54" y="142.2" text-anchor="middle" font-size="12" fill="var(--_bg)" stroke="none">3</text></g></g><g class="pele-edge pele-message" data-id="i5"><path d="M571.54,209H593.54A6,6 0 0 1 599.54,215V225A6,6 0 0 1 593.54,231H570.54"/><path class="pele-marker" d="M563.54,231L571.54,227.64L571.54,234.36Z" f