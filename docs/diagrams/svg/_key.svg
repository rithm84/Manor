<svg xmlns="http://www.w3.org/2000/svg" class="pele-doc" viewBox="0 0 1162 124" width="1162" height="124" style="max-width:100%;height:auto" role="img" aria-label="Diagram key · node roles"><title>Diagram key · node roles</title><style><![CDATA[
/*
  Shared Manor diagram theme. docs/diagrams/render.mjs embeds this file in every
  exported SVG, so a diagram source names roles (`:::app`) and edge kinds
  (`async_1@-.->`) and never sets a color itself. Pick a role by what a node is,
  never by how it should look. Colors follow the reader's light or dark scheme.
*/

.pele-doc {
  --pele-bg: #ffffff;
  --pele-fg: #25222a;
  --pele-muted: #625a6c;
  --pele-line: #5f5869;
  --pele-surface: #f4f3f6;
  --pele-surface-alt: #f8f7fa;
  --pele-border: #625a6c;
  --pele-accent: #75508f;
  --pele-critical: #c44d41;
  --pele-radius: 6px;

  --people-fill: #e7f5ff;   --people-stroke: #1971c2;
  --app-fill: #f3ecf8;      --app-stroke: #75508f;
  --local-fill: #e3fafc;    --local-stroke: #0c8599;
  --backend-fill: #e5f5e8;  --backend-stroke: #2f9e44;
  --agent-fill: #edf2ff;    --agent-stroke: #4263eb;
  --external-fill: #fff0ed; --external-stroke: #c44d41;
  --async-fill: #ffe8cc;    --async-stroke: #e8590c;
  --gate-fill: #fff4d6;     --gate-stroke: #b37c00;
  --neutral-fill: #f4f3f6;  --neutral-stroke: #625a6c;

  --edge-async: #e8590c;   --edge-async-text: #b3470a;
  --edge-blocked: #c44d41; --edge-blocked-text: #a13a2f;
  --edge-ok: #2f9e44;      --edge-ok-text: #23783a;
}

@media (prefers-color-scheme: dark) {
  .pele-doc {
    --pele-bg: #19181d;
    --pele-fg: #f3eff7;
    --pele-muted: #b9afc4;
    --pele-line: #b9afc4;
    --pele-surface: #201f25;
    --pele-surface-alt: #1c1b21;
    --pele-border: #887b94;
    --pele-accent: #c29bdc;
    --pele-critical: #ff8787;

    --people-fill: #0c2a43;   --people-stroke: #4dabf7;
    --app-fill: #2c2136;      --app-stroke: #c29bdc;
    --local-fill: #0b3338;    --local-stroke: #3bc9db;
    --backend-fill: #11321b;  --backend-stroke: #51cf66;
    --agent-fill: #1b2349;    --agent-stroke: #91a7ff;
    --external-fill: #3d1714; --external-stroke: #ff8787;
    --async-fill: #4a2508;    --async-stroke: #ff922b;
    --gate-fill: #3d2e05;     --gate-stroke: #fcc419;
    --neutral-fill: #26242c;  --neutral-stroke: #9d93a8;

    --edge-async: #ff922b;   --edge-async-text: #ffa94d;
    --edge-blocked: #ff8787; --edge-blocked-text: #ffa8a8;
    --edge-ok: #51cf66;      --edge-ok-text: #69db7c;
  }
}

.pele-doc > .pele-doc-bg { fill: var(--pele-bg); }

/* Roles: fill and stroke only; text stays the ink color. */
.pele-node.people > :is(rect, path, polygon, circle, ellipse),
.pele-node.people > g > path { fill: var(--people-fill); stroke: var(--people-stroke); }
.pele-node.app > :is(rect, path, polygon, circle, ellipse),
.pele-node.app > g > path { fill: var(--app-fill); stroke: var(--app-stroke); }
.pele-node.local > :is(rect, path, polygon, circle, ellipse),
.pele-node.local > g > path { fill: var(--local-fill); stroke: var(--local-stroke); }
.pele-node.backend > :is(rect, path, polygon, circle, ellipse),
.pele-node.backend > g > path { fill: var(--backend-fill); stroke: var(--backend-stroke); }
.pele-node.agent > :is(rect, path, polygon, circle, ellipse),
.pele-node.agent > g > path { fill: var(--agent-fill); stroke: var(--agent-stroke); }
.pele-node.external > :is(rect, path, polygon, circle, ellipse),
.pele-node.external > g > path { fill: var(--external-fill); stroke: var(--external-stroke); }
.pele-node.async > :is(rect, path, polygon, circle, ellipse),
.pele-node.async > g > path { fill: var(--async-fill); stroke: var(--async-stroke); }
.pele-node.gate > :is(rect, path, polygon, circle, ellipse),
.pele-node.gate > g > path { fill: var(--gate-fill); stroke: var(--gate-stroke); }
.pele-node.neutral > :is(rect, path, polygon, circle, ellipse),
.pele-node.neutral > g > path { fill: var(--neutral-fill); stroke: var(--neutral-stroke); }

/* Subgraphs are boundaries: a dashed outline, like a zone. Swimlanes share
   their borders, so theirs stay solid; a sequence box is a shaded region with no
   outline, because message labels have no background to hide a line behind. */
.pele-cluster > rect { stroke-dasharray: 5 4; }
.pele-lane > rect { stroke-dasharray: none; }
.pele-box > rect { stroke: none; fill: var(--pele-surface); fill-opacity: 1; }

/* A `row_*` subgraph only arranges its nodes into a row; it draws nothing. */
.pele-cluster[data-id^="row_"] { display: none; }

/* Edge kinds, selected by the edge id prefix the source gives the edge. */
.pele-edge[data-id^="async_"] > path { stroke: var(--edge-async); }
.pele-edge[data-id^="async_"] > path.pele-marker { fill: var(--edge-async); stroke: none; }
.pele-edge-label[data-id^="async_"] text { fill: var(--edge-async-text); }
.pele-edge[data-id^="blocked_"] > path { stroke: var(--edge-blocked); }
.pele-edge[data-id^="blocked_"] > path.pele-marker { fill: var(--edge-blocked); stroke: none; }
.pele-edge-label[data-id^="blocked_"] text { fill: var(--edge-blocked-text); }
.pele-edge[data-id^="ok_"] > path { stroke: var(--edge-ok); }
.pele-edge[data-id^="ok_"] > path.pele-marker { fill: var(--edge-ok); stroke: none; }
.pele-edge-label[data-id^="ok_"] text { fill: var(--edge-ok-text); }
]]></style><rect class="pele-doc-bg" width="1162" height="124" rx="8"/><svg x="0" y="0" class="pele pele-block" viewBox="0 0 1162 124" width="1162" height="124" style="--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="block"><g class="pele-nodes"><g class="pele-node pele-shape-rect people" data-id="k_people" transform="translate(117.78,32)"><rect x="-109.78" y="-24" width="219.57" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);stroke-width:1px;"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">People · surfaces</text></g><g class="pele-node pele-shape-rect app" data-id="k_app" transform="translate(349.35,32)"><rect x="-109.78" y="-24" width="219.57" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);stroke-width:1px;"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Manor Mac app</text></g><g class="pele-node pele-shape-rect local" data-id="k_local" transform="translate(580.92,32)"><rect x="-109.78" y="-24" width="219.57" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);stroke-width:1px;"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Local storage · sync</text></g><g class="pele-node pele-shape-rect backend" data-id="k_backend" transform="translate(812.49,32)"><rect x="-109.78" y="-24" width="219.57" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);stroke-width:1px;"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Supabase · durable data</text></g><g class="pele-node pele-shape-rect agent" data-id="k_agent" transform="translate(1044.06,32)"><rect x="-109.78" y="-24" width="219.57" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);stroke-width:1px;"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Agents · AI models</text></g><g class="pele-node pele-shape-rect external" data-id="k_external" transform="translate(117.78,92)"><rect x="-109.78" y="-24" width="219.57" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);stroke-width:1px;"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">External providers</text></g><g class="pele-node pele-shape-rect async" data-id="k_async" transform="translate(349.35,92)"><rect x="-109.78" y="-24" width="219.57" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);stroke-width:1px;"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Background · async work</text></g><g class="pele-node pele-shape-rect gate" data-id="k_gate" transform="translate(580.92,92)"><rect x="-109.78" y="-24" width="219.57" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);stroke-width:1px;"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Checks · gates</text></g><g class="pele-node pele-shape-rect neutral" data-id="k_neutral" transform="translate(812.49,92)"><rect x="-109.78" y="-24" width="219.57" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r);stroke-width:1px;"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Neutral · closed</text></g></g></svg></svg>
